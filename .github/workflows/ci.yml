name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Required so checks report back for merge-queue entries: the queue runs
  # workflows on a temporary branch via merge_group, not pull_request.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on the runner image -- currently 0.9.0.
      # actionlint and zizmor are pinned and installed.

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint actionlint.tar.gz

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: Check
        run: make check
